# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[remote.github]
owner = "kristof-mattei"
repo = "rust-seed"

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/#getting-started
header = """
<!-- header goes here -->
"""
# Used by `--prepend` to remove the previous header.
header_marker = "<!-- git-cliff: end of header -->"
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
        {% if commit.remote.pr_author %} by [@{{ commit.remote.pr_author }}](https://github.com/{{ commit.remote.pr_author }}){%- endif %}\
        {% if commit.remote.pr_number %} in #{{ commit.remote.pr_number }}{%- endif %}\
        {% if commit.id %} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::remote_url() }}/commit/{{ commit.id }})){%- endif %}\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
          ({{ self::remote_url() }}/compare/{{ previous.version }}..{{ extra.compare_to | default(value=version) }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    {#- Renovate bumps the same crate multiple times per release. The version is the last word of the message, key on the rest and keep the newest. -#}
    {%- set_global seen = [] -%}
    {%- set_global dropped = [] -%}
    {%- for commit in entry.commits | filter(attribute="scope", value="deps") | filter(attribute="author.name", value="renovate[bot]") | reverse -%}
        {%- set key = commit.message | split(pat=" ") | slice(end=-1) | join(sep=" ") -%}
        {%- if key in seen -%}
            {%- set_global dropped = dropped | concat(with=commit.id) -%}
        {%- else -%}
            {%- set_global seen = seen | concat(with=key) -%}
        {%- endif -%}
    {%- endfor %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {%- if commit.id not in dropped %}
            {{ self::print_commit(commit=commit) }}
        {%- endif %}
    {%- endfor %}
    {% for commit in entry.commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/#getting-started
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = true
# An array of regex based postprocessors to modify the changelog.
postprocessors = [
    # Replace the placeholder <REPO> with a URL.
    { pattern = '<REPO>', replace = "https://github.com/kristof-mattei/rust-seed" },
]
# render body even when there are no releases to process
# render_always = true
# output file path
# output = "test.md"

[git]
# An entry is a merged pull request: the parsers read its title, and the release workflow fills message, scope, and breaking from it.
conventional_commits = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [
    # Replace issue numbers with link templates to be updated in `changelog.postprocessors`.
    #{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))"},
    # Check spelling of the commit message using https://github.com/crate-ci/typos.
    # If the spelling is incorrect, it will be fixed automatically.
    #{ pattern = '.*', replace_command = 'typos --write-changes -' },
]
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
    { field = "merge_commit", pattern = "false", skip = true },
    { field = "remote.pr_title", pattern = "^feat", group = "<!-- 0 -->🚀 Features" },
    { field = "remote.pr_title", pattern = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { field = "remote.pr_title", pattern = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { field = "remote.pr_title", pattern = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { field = "remote.pr_title", pattern = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
    { field = "remote.pr_title", pattern = "^style", group = "<!-- 5 -->🎨 Styling" },
    { field = "remote.pr_title", pattern = "^test", group = "<!-- 6 -->🧪 Testing" },
    { field = "remote.pr_title", pattern = "^chore\\(release\\)", skip = true },
    { field = "remote.pr_title", pattern = "^chore\\(deps.*\\)", skip = true },
    { field = "remote.pr_title", pattern = "^chore\\(pr\\)", skip = true },
    { field = "remote.pr_title", pattern = "^chore\\(pull\\)", skip = true },
    { field = "remote.pr_title", pattern = "^chore|^ci|^build", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { field = "remote.pr_title", pattern = "^revert", group = "<!-- 9 -->◀️ Revert" },
    { field = "remote.pr_title", pattern = ".*", group = "<!-- 10 -->💼 Other" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# Regex to select git tags that represent releases.
tag_pattern = "v[0-9].*"
# An array of link parsers for extracting external references, and turning them into URLs, using regex.
link_parsers = []
# Include only the tags that belong to the current branch.
use_branch_tags = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# Process submodules commits
recurse_submodules = false
