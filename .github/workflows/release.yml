# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release type"
        type: choice
        default: none
        options:
          - none
          - alpha
          - beta
          - rc

concurrency:
  # Label toggles dispatch this workflow too; stacked dispatches collapse to one running plus the newest queued run
  group: release
  cancel-in-progress: false # this job force-pushes branches and opens PRs, let it finish

permissions:
  contents: write # to create the release commit via createCommitOnBranch
  pull-requests: read # to list open release PRs

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
    steps:
      - name: Only on main
        if: |
          github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Only to be executed on main"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          show-progress: false
          token: ${{ secrets.TOKEN_TO_TRIGGER_SUBSEQUENT_WORKFLOWS }}

      - name: Install git-cliff to generate changelog & next version number
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: git-cliff

      - name: Compute version
        shell: bash
        id: release
        env:
          # git-cliff reads GITHUB_TOKEN from the environment
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag=$(git describe --tags --abbrev=0 || true)
          echo "latest_tag=${latest_tag}" >> "${GITHUB_OUTPUT}"

          prerelease="${{ inputs.prerelease }}"

          echo "::notice::Latest tag: ${latest_tag:-none}"
          echo "::notice::Pre-release type: ${prerelease}"

          if [ -n "${latest_tag}" ] && [ -z "$(git log "${latest_tag}..HEAD" --oneline)" ]; then
            # no commits since last tag, only allow if this is a promotion through pre-release stages
            tier_of() {
              case "$1" in
                alpha) echo 0 ;;
                beta)  echo 1 ;;
                rc)    echo 2 ;;
                none)  echo 3 ;;
                *)     echo -1 ;;
              esac
            }

            if [[ "${latest_tag}" =~ -(alpha|beta|rc)\.[0-9]+$ ]]; then
              latest_type="${BASH_REMATCH[1]}"
            else
              latest_type="none"
            fi

            latest_tier=$(tier_of "${latest_type}")
            requested_tier=$(tier_of "${prerelease}")

            if [ "${requested_tier}" -le "${latest_tier}" ]; then
              echo "::error::No commits since ${latest_tag} and ${prerelease} is not a promotion from ${latest_type}."
              exit 1
            fi
          fi

          bump_flag="auto"
          bumped=$(git-cliff --bumped-version --bump ${bump_flag} --unreleased --offline)

          # If git-cliff didn't bump (e.g. chore/ci only commits), force a patch increment
          # so we never release the same version as the last tag.
          if [ "${bumped}" = "${latest_tag}" ]; then
            bump_flag="patch"
            bumped=$(git-cliff --bumped-version --bump patch --unreleased --offline)
            echo "::notice::No conventional bump detected, forcing patch bump"
          fi

          version="${bumped}"

          # Strip any pre-release suffix git-cliff may have picked up (keep only vX.Y.Z)
          [[ "$version" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+) ]] && version="${BASH_REMATCH[1]}"
          echo "::notice::Base version: ${version}"
          echo "version=$version" >> "${GITHUB_OUTPUT}"

          if [ "${prerelease}" != "none" ]; then
            # Pre-release types in ascending order
            pre_types=("alpha" "beta" "rc")

            # Find the index of the requested pre-release type
            requested_index=-1
            for i in "${!pre_types[@]}"; do
              if [ "${pre_types[$i]}" = "${prerelease}" ]; then
                requested_index=$i
              fi
            done

            # Check if a higher-tier pre-release already exists for this base version
            for i in "${!pre_types[@]}"; do
              if [ "$i" -gt "$requested_index" ]; then
                if git tag --list "${version}-${pre_types[$i]}.*" | grep -q .; then
                  echo "::error::Cannot create ${prerelease} pre-release: ${pre_types[$i]} pre-release already exists for ${version}."
                  exit 1
                fi
              fi
            done

            # Determine the next pre-release number by finding the highest existing tag with this suffix
            latest_pre=$(git tag --list "${version}-${prerelease}.*" | sort --field-separator . --key 4 --numeric-sort | tail -1)

            if [ -n "$latest_pre" ]; then
              pre_number=$(( ${latest_pre##*-"${prerelease}".} + 1 ))
            else
              pre_number=1
            fi

            release_version="${version}-${prerelease}.${pre_number}"
          else
            release_version="${version}"
          fi

          echo "::notice::Release version: ${release_version}"
          echo "release_version=$release_version" >> "${GITHUB_OUTPUT}"

          branch="release/${release_version}"
          echo "::notice::Branch: ${branch}"
          echo "branch=$branch" >> "${GITHUB_OUTPUT}"

          commit_message="chore(release): prepare for ${release_version}"
          echo "commit_message=${commit_message}" >> "${GITHUB_OUTPUT}"

          main_sha=$(git rev-parse HEAD)
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"

      - name: Derive the changelog selection
        shell: bash
        id: selection
        env:
          LATEST_TAG: ${{ steps.release.outputs.latest_tag }}
        run: |
          range="${LATEST_TAG:+${LATEST_TAG}..}HEAD"

          grep --invert-match --extended-regexp '^(#|[[:space:]]*$)' .changelog-shown > "${RUNNER_TEMP}/queued.txt" || true
          cut --delimiter=" " --fields=1 < "${RUNNER_TEMP}/queued.txt" > "${RUNNER_TEMP}/shown.txt"

          git rev-list "${range}" > "${RUNNER_TEMP}/unreleased.txt"

          # An empty pattern file matches nothing, so an empty queue hides the whole range
          grep --fixed-strings --line-regexp --invert-match --file "${RUNNER_TEMP}/shown.txt" "${RUNNER_TEMP}/unreleased.txt" > .cliffignore || true

          # Merge commit subjects are pull request titles, so listing what stays hidden costs no API call
          git log --merges --format="%H %s" "${range}" > "${RUNNER_TEMP}/merges.txt"
          grep --fixed-strings --invert-match --file "${RUNNER_TEMP}/shown.txt" "${RUNNER_TEMP}/merges.txt" > "${RUNNER_TEMP}/hidden.txt" || true
          sed --regexp-extended 's/^[0-9a-f]+ /- /' "${RUNNER_TEMP}/hidden.txt" > "${RUNNER_TEMP}/hidden.md"

          echo "hidden-file=${RUNNER_TEMP}/hidden.md" >> "${GITHUB_OUTPUT}"

          # The queue drains with the release commit, .cliffignore at the tag becomes the record of what this release hid
          grep --extended-regexp '^#' .changelog-shown > "${RUNNER_TEMP}/drained" || true
          mv "${RUNNER_TEMP}/drained" .changelog-shown

      - name: Generate the changelog
        shell: bash
        env:
          # git-cliff reads GITHUB_TOKEN from the environment
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          # Without this a queued commit that isn't conventional renders as nothing at all. .cliffignore is applied first, so
          # only the queued commits have to satisfy it, and a bad merge commit message fails the release instead of vanishing.
          GIT_CLIFF__GIT__REQUIRE_CONVENTIONAL: "true"
        run: |
          # Prepend only the new section, the history below it is frozen text.
          # git-cliff skips the commits listed in .cliffignore, so only queued entries render.
          git-cliff --unreleased --tag "${RELEASE_VERSION}" --prepend CHANGELOG.md

      - name: Create release commit
        id: commit
        uses: ./.github/actions/create-release-commit
        with:
          branch: ${{ steps.release.outputs.branch }}
          base-sha: ${{ steps.release.outputs.main_sha }}
          headline: ${{ steps.release.outputs.commit_message }}
          files: CHANGELOG.md .cliffignore .changelog-shown
          # GITHUB_TOKEN attributes the API commit to github-actions[bot]. The branch itself is pushed with the checkout PAT so workflows trigger.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render the release PR body
        shell: bash
        id: body
        env:
          # git-cliff reads GITHUB_TOKEN from the environment
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RELEASE_SHA: ${{ steps.commit.outputs.commit-sha }}
          HIDDEN_FILE: ${{ steps.selection.outputs.hidden-file }}
        run: |
          # Point the compare link at the release-branch head SHA, because the release tag doesn't exist until after the PR is merged
          git-cliff --context --unreleased --tag "${RELEASE_VERSION}" \
            | jq --arg sha "${RELEASE_SHA}" '.[0].extra = {compare_to: $sha}' \
            > "${RUNNER_TEMP}/diff-context.json"

          git-cliff --from-context "${RUNNER_TEMP}/diff-context.json" --output "${RUNNER_TEMP}/shown.md"

          body_file="${RUNNER_TEMP}/body.md"

          {
          cat <<'NOTE'
          > [!NOTE]
          > The entries below ship in `CHANGELOG.md` and the release notes. Label a PR `changelog: show` to add it, unlabel to remove it, this PR rebuilds automatically.
          > Hidden PRs still ship in the release and still count toward the version number.

          NOTE
          cat "${RUNNER_TEMP}/shown.md"
          echo
          echo "---"
          echo
          echo "### Hidden from the changelog"
          echo
          if [ -s "${HIDDEN_FILE}" ]; then
            cat "${HIDDEN_FILE}"
          else
            echo "Nothing is hidden."
          fi
          } > "${body_file}"

          # Truncate if the body exceeds GitHub's PR body character limit
          max_length=65536
          truncation_message=$'\n\n---\n\n> **Note:** Body was truncated because it exceeded GitHub'"'"'s 65,536 character limit.'
          file_length=$(wc --chars < "${body_file}")

          if [ "${file_length}" -gt "${max_length}" ]; then
            truncated_length=$(( max_length - ${#truncation_message} ))
            TRUNC="${truncated_length}" perl -CSD -0777 -pe '$_ = substr($_, 0, $ENV{TRUNC})' "${body_file}" > "${body_file}.truncated"
            printf '%s' "${truncation_message}" >> "${body_file}.truncated"
            mv "${body_file}.truncated" "${body_file}"
          fi

          echo "body-file=${body_file}" >> "${GITHUB_OUTPUT}"

      - name: Open or update pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_TO_TRIGGER_SUBSEQUENT_WORKFLOWS }}
          BODY_FILE: ${{ steps.body.outputs.body-file }}
        run: |
          branch="${{ steps.release.outputs.branch }}"
          release_version="${{ steps.release.outputs.release_version }}"

          # Check if a PR already exists for this branch
          existing_pr=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')

          if [ -n "$existing_pr" ]; then
            # gh pr edit needs read:org, even for --body (cli/cli#13575).
            # The REST PATCH works with just the repo scope.
            gh api --method PATCH --silent "repos/${GITHUB_REPOSITORY}/pulls/${existing_pr}" \
              --field "body=@${BODY_FILE}"
          else
            # Opened with the PAT, the default token's pull_request events don't run the required checks
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore(release): Release ${release_version}" \
              --body-file "${BODY_FILE}"
          fi

          # A commit that changes the bump lands this release on a different branch than the open one, and both would stay
          # open with nothing to choose between them. Closing runs last, so a failure above leaves the old PR in place.
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release/v")) | "\(.number) \(.headRefName)"' \
            > "${RUNNER_TEMP}/release-prs.txt"

          while read -r number head_ref; do
            if [ "${head_ref}" != "${branch}" ]; then
              echo "::notice::Closing superseded release PR #${number} (${head_ref})"
              gh pr close "${number}" --delete-branch --comment "Superseded by the release PR for ${release_version}."
            fi
          done < "${RUNNER_TEMP}/release-prs.txt"

      - name: Clean up stranded branches
        if: ${{ (failure() || cancelled()) && steps.release.outputs.branch != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${{ steps.release.outputs.branch }}"

          git push origin --delete "${branch}-staging" || true

          # Deleting the release branch would close its PR, so keep it when one exists.
          # A failing `gh pr list` fails the step (set -e) instead of counting as "no PR".
          open_pr=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')

          if [ -z "${open_pr}" ]; then
            git push origin --delete "${branch}" || true
          fi
