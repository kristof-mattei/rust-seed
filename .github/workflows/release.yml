# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  workflow_dispatch:

concurrency:
  # Two runs would force-push the same branch
  group: "${{ github.workflow }}"
  cancel-in-progress: false # this job force-pushes branches and opens PRs, let it finish

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
    permissions:
      actions: write # to dispatch this workflow again when main moved during the run
      contents: write # to create the release commit via createCommitOnBranch
      issues: write # to create the changelog label
      pull-requests: write # to refresh the release PR body and close superseded release PRs
    steps:
      - name: Only on main
        if: |
          github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Only to be executed on main"
          exit 1

      # zizmor: ignore[artipacked] the release branch is pushed with this credential, see the release step
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          token: ${{ secrets.TOKEN_TO_TRIGGER_SUBSEQUENT_WORKFLOWS }}

      - name: Install git-cliff to generate changelog & next version number
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: git-cliff

      - name: Compute version and build the release context
        shell: bash
        id: release
        env:
          # git-cliff reads GITHUB_TOKEN from the environment
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag=$(git describe --tags --abbrev=0 || true)

          echo "::notice::Latest tag: ${latest_tag:-none}"

          if [ -n "${latest_tag}" ] && [ -z "$(git log "${latest_tag}..HEAD" --oneline)" ]; then
            echo "::error::No commits since ${latest_tag}."
            exit 1
          fi

          version=$(git-cliff --config cliff-version.toml --bumped-version --bump auto --unreleased --offline)

          # If git-cliff didn't bump (e.g. chore/ci only commits), force a patch increment
          # so we never release the same version as the last tag.
          if [ "${version}" = "${latest_tag}" ]; then
            version=$(git-cliff --config cliff-version.toml --bumped-version --bump patch --unreleased --offline)
            echo "::notice::No conventional bump detected, forcing patch bump"
          fi

          echo "::notice::Version: ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          branch="release/${version}"
          echo "::notice::Branch: ${branch}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

          commit_message="chore(release): prepare for ${version}"
          echo "commit_message=${commit_message}" >> "${GITHUB_OUTPUT}"

          main_sha=$(git rev-parse HEAD)
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"

          merged_since=""
          if [ -n "${latest_tag}" ]; then
            merged_since=$(TZ=UTC git log --max-count=1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "${latest_tag}")
          fi
          echo "merged_since=${merged_since}" >> "${GITHUB_OUTPUT}"

          # The entry text is the PR title: the description becomes the message, scope and breaking marker come from the prefix
          git-cliff --context --unreleased --tag "${version}" \
          | jq '.[0].commits |= map(
              (.remote.pr_title | capture("^[a-z]+(\\((?<scope>[a-z0-9-]+)\\))?(?<breaking>!)?: (?<description>.+)$") // {description: .}) as $title
              | .message = $title.description
              | .scope = $title.scope
              | .breaking = ($title.breaking != null)
            )' > release-context.json

      - name: List open release PRs
        shell: bash
        id: siblings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list \
            --state open \
            --limit 100 \
            --json number,headRefName \
          | jq --raw-output '
              .[]
              | select(.headRefName | startswith("release/v"))
              | "\(.number) \(.headRefName)"
            ' > "${RUNNER_TEMP}/siblings.txt"

          echo "file=${RUNNER_TEMP}/siblings.txt" >> "${GITHUB_OUTPUT}"

      - name: Create the changelog label
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "changelog: show" --force --color 0E8A16 --description "Listed in the changelog of the next release"

      - name: Generate the changelog
        shell: bash
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The version above counted every entry, the label only decides which ones the changelog lists
          gh pr list --state merged --base main --label "changelog: show" --limit 1000 --json mergeCommit --jq '.[].mergeCommit.oid' | sort --unique > "${RUNNER_TEMP}/shown.txt"

          jq --raw-input --slurp 'split("\n") | map(select(length > 0))' "${RUNNER_TEMP}/shown.txt" > "${RUNNER_TEMP}/shown.json"
          jq --slurpfile shown "${RUNNER_TEMP}/shown.json" '.[0].commits |= map(select(.id | IN($shown[0][])))' release-context.json > "${RUNNER_TEMP}/shown-context.json"

          git-cliff --from-context "${RUNNER_TEMP}/shown-context.json" --prepend CHANGELOG.md --unreleased

          echo "shown-file=${RUNNER_TEMP}/shown.txt" >> "${GITHUB_OUTPUT}"

      - name: Create release commit
        id: commit
        uses: $/.github/actions/create-release-commit
        with:
          branch: ${{ steps.release.outputs.branch }}
          base-sha: ${{ steps.release.outputs.main_sha }}
          headline: ${{ steps.release.outputs.commit_message }}
          files: CHANGELOG.md
          # GITHUB_TOKEN attributes the commit to github-actions[bot]
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render the release preview
        id: preview
        uses: $/.github/actions/render-release-preview
        with:
          context-file: release-context.json
          compare-to: ${{ steps.release.outputs.branch }}
          shown-file: ${{ steps.changelog.outputs.shown-file }}
          merged-since: ${{ steps.release.outputs.merged_since }}

      - name: Open or update pull request
        shell: bash
        env:
          BODY_FILE: ${{ steps.preview.outputs.body-file }}
          BRANCH: ${{ steps.release.outputs.branch }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TOKEN_TO_TRIGGER_SUBSEQUENT_WORKFLOWS }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Check if a PR already exists for this branch
          existing_pr=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')

          if [ -n "$existing_pr" ]; then
            # An edit made with GITHUB_TOKEN does not fire pull_request events, so a body refresh does not re-run the checks.
            # gh pr edit needs read:org even for --body (cli/cli#13575), so the body is set with a REST PATCH.
            GH_TOKEN="${DEFAULT_TOKEN}" gh api --method PATCH --silent "repos/${GITHUB_REPOSITORY}/pulls/${existing_pr}" \
              --field "body=@${BODY_FILE}"

            # Undo the draft set by rebuild-release-after-label.yml. A draft cannot carry auto-merge, so this comes before the disable below.
            gh pr ready "${existing_pr}"

            # GitHub does not disable auto-merge on a push by a collaborator
            GH_TOKEN="${DEFAULT_TOKEN}" gh pr merge "${existing_pr}" --disable-auto
          else
            # Opening the PR with GITHUB_TOKEN would not start the required check workflows, so the PAT is used here
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "chore(release): Release ${VERSION}" \
              --body-file "${BODY_FILE}"
          fi

      - name: Close superseded release PRs
        shell: bash
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIBLINGS_FILE: ${{ steps.siblings.outputs.file }}
        run: |
          # A commit that lands after the release PR opened can bump the version. That renames the release branch and leaves the old PR open.
          new_pr=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number')

          while read -r pr_number head_ref; do
            if [ "${head_ref}" = "${BRANCH}" ]; then
              continue
            fi

            echo "::notice::Closing #${pr_number}, superseded by #${new_pr}"

            gh pr close "${pr_number}" --delete-branch --comment "Superseded by #${new_pr}."
          done < "${SIBLINGS_FILE}"

      - name: Dispatch again if main moved
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_SHA: ${{ steps.release.outputs.main_sha }}
        run: |
          # If main moved between the checkout and the PR creation, "Rebuild release after push" found no open release PR yet, so dispatch here instead
          current_main=$(git ls-remote origin refs/heads/main | cut --fields 1)

          if [ "${current_main}" = "${MAIN_SHA}" ]; then
            exit 0
          fi

          echo "::notice::main moved from ${MAIN_SHA} to ${current_main}, dispatching again"

          gh workflow run release.yml --ref main

      - name: Clean up stranded branches
        if: ${{ (failure() || cancelled()) && steps.release.outputs.branch != '' }}
        shell: bash
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin --delete "${BRANCH}-staging" || true

          # Deleting the release branch would close its PR, so keep it when one exists.
          # A failing `gh pr list` fails the step (set -e) instead of counting as "no PR".
          open_pr=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')

          if [ -z "${open_pr}" ]; then
            git push origin --delete "${BRANCH}" || true
          fi
