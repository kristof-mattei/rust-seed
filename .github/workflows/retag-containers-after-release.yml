# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Retag container after release

on:
  release:
    types:
      - released
      - prereleased

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false # last one must win in case of multiple releases

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write
  security-events: write

env:
  CARGO_TERM_COLOR: always
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME }}

jobs:
  repo-has-container:
    name: Repo has container?
    runs-on: ubuntu-latest
    outputs:
      has_container: ${{ steps.determine.outputs.has_container }}

    steps:
      - name: Repo has docker container?
        id: determine
        shell: bash
        run: |
          has_container="${{ vars.HAS_CONTAINER }}"
          echo "has_container=${has_container:-false}" >> "${GITHUB_OUTPUT}"

  retag-containers:
    name: Retag the containers
    runs-on: ubuntu-latest
    needs:
      - repo-has-container
    if: |
      fromJSON(needs.repo-has-container.outputs.has_container) == true
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}

      - name: Log into Docker Hub
        if: env.DOCKERHUB_IMAGE_NAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set full image name
        shell: bash
        run: |
          echo "FULL_IMAGE_NAME=${REGISTRY,,}/${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "FULL_DOCKERHUB_IMAGE_NAME=docker.io/${DOCKERHUB_IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Find source tag using GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          repo_lower="${repo,,}"

          # the source tag is pushed by the push-triggered retag workflow, which may still be running, so poll
          OLD_TAG=""

          for attempt in $(seq 1 30); do
            if ((attempt > 1)); then
              sleep 30
            fi

            echo "Looking for source tag sha-${{ github.sha }}-* (attempt ${attempt} of 30)"

            # || true: no match yet, or a transient api error, both mean retry
            OLD_TAG=$(gh api "/users/${{ github.repository_owner }}/packages/container/${repo_lower##*/}/versions" \
              --paginate \
              --jq '.[] | .metadata.container.tags[]' | grep "^sha-${{ github.sha }}-.*\$" | head --lines 1) || true # .* is actual or retag

            if [ -n "${OLD_TAG}" ]; then
              break
            fi
          done

          if [ -z "${OLD_TAG}" ]; then
            echo "::error::No matching source tag found for SHA ${{ github.sha }}"
            exit 1
          fi

          echo "OLD_TAG=${OLD_TAG}" >> "${GITHUB_ENV}"

      - name: Set the new TAGs
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          tags: |
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{version}},prefix=v

      - name: Set the new Docker Hub TAGs
        if: env.DOCKERHUB_IMAGE_NAME != ''
        id: meta-dockerhub
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: "docker.io/${{ env.DOCKERHUB_IMAGE_NAME }}"
          tags: |
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{version}},prefix=v

      - name: Get image digest
        shell: bash
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "${FULL_IMAGE_NAME}:${OLD_TAG}" --format "{{json .}}" | jq --raw-output ".manifest.digest")
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Actually re-tag the container
        shell: bash
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r new_tag
            do
              docker buildx imagetools create --tag "${new_tag}" "${FULL_IMAGE_NAME}:${OLD_TAG}"
          done

      - name: Attest GHCR image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.FULL_IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Copy the container to Docker Hub
        if: env.DOCKERHUB_IMAGE_NAME != ''
        shell: bash
        run: |
          echo "${{ steps.meta-dockerhub.outputs.tags }}" | while IFS= read -r new_tag
            do
              if [ "$(skopeo inspect --format '{{ .Digest }}' --no-tags "docker://${new_tag}" 2>/dev/null)" = "${{ steps.digest.outputs.digest }}" ]; then
                echo "${new_tag} already exists, skipping"
                continue
              fi

              skopeo copy --all --preserve-digests --command-timeout 70s --retry-times 5 "docker://${FULL_IMAGE_NAME}:${OLD_TAG}" "docker://${new_tag}"
          done

      - name: Attest Docker Hub image
        if: env.DOCKERHUB_IMAGE_NAME != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.FULL_DOCKERHUB_IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Trivy scan (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.FULL_IMAGE_NAME }}@${{ steps.digest.outputs.digest }}"
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results-linux-amd64.sarif
          limit-severities-for-sarif: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: linux/amd64

      - name: Upload Trivy scan results (linux/amd64)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results-linux-amd64.sarif
          category: trivy-linux-amd64

      - name: Trivy scan (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.FULL_IMAGE_NAME }}@${{ steps.digest.outputs.digest }}"
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results-linux-arm64.sarif
          limit-severities-for-sarif: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: linux/arm64

      - name: Upload Trivy scan results (linux/arm64)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results-linux-arm64.sarif
          category: trivy-linux-arm64
