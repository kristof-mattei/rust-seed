# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint commits

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      # the title is linted below, so a retitle has to re-run this
      - edited
    branches:
      - main

concurrency:
  # each new commit to a PR runs this workflow, the older run's result is obsolete, so cancel it
  group: "${{ github.workflow }} @ ${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 0

      - name: Enforce strict conventional subjects
        shell: bash
        run: |
          # Enforce '<type>(<scope>)!: <description>' with lowercase type and scope.
          pattern='^[0-9a-f]+ [a-z]+(\([a-z0-9-]+\))?!?: .+$'
          if git log --no-merges --format="%h %s" "origin/${GITHUB_BASE_REF}..HEAD" | grep --extended-regexp --invert-match "${pattern}"; then
            echo "The commit(s) above do not match '<type>(<scope>)!: <description>' with a lowercase type and scope"
            exit 1
          fi

      - name: Enforce a strict conventional title matching the commits' tier
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The title is the changelog entry and the commits set the version, so both have to agree on breaking, feature, fix, or none.
          if ! grep --quiet --extended-regexp '^[a-z]+(\([a-z0-9-]+\))?!?: .+$' <<< "${PR_TITLE}"; then
            echo "The title '${PR_TITLE}' does not match '<type>(<scope>)!: <description>' with a lowercase type and scope"
            exit 1
          fi

          tiers=("no version change" "a fix" "a feature" "a breaking change")

          tier_of() {
            case "${1%%: *}" in
              *!) echo 3 ;;
              feat | feat\(*) echo 2 ;;
              fix | fix\(*) echo 1 ;;
              *) echo 0 ;;
            esac
          }

          commits_tier=0
          while IFS= read -r subject; do
            tier=$(tier_of "${subject}")
            if [ "${tier}" -gt "${commits_tier}" ]; then
              commits_tier=${tier}
            fi
          done < <(git log --no-merges --format=%s "origin/${GITHUB_BASE_REF}..HEAD")

          if git log --no-merges --format=%B "origin/${GITHUB_BASE_REF}..HEAD" | grep --quiet --extended-regexp '^BREAKING[ -]CHANGE: '; then
            commits_tier=3
          fi

          title_tier=$(tier_of "${PR_TITLE}")

          if [ "${title_tier}" -ne "${commits_tier}" ]; then
            echo "The title '${PR_TITLE}' declares ${tiers[title_tier]}, the commits amount to ${tiers[commits_tier]}"
            exit 1
          fi
