# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Verify changelog selection

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify changelog selection
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read # to list the labeled PRs, needs this in private repos
    # The check is required on every PR, and a skipped job satisfies it on the PRs that are not a release
    if: |
      github.event.pull_request.state == 'open' &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Check the release commit is built on main
        shell: bash
        run: |
          # Release builds the release commit directly on a main commit. After "Update branch" the first parent is the old release commit, and a rebuild on top of it keeps it there.
          if ! git merge-base --is-ancestor HEAD~1 origin/main; then
            echo "::error::The release commit is not built on main. Re-run the Release workflow instead of using Update branch."
            exit 1
          fi

      - name: Extract tag from branch name
        id: tag
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # release/v0.4.8 -> v0.4.8
          echo "tag=${BRANCH#release/}" >> "${GITHUB_OUTPUT}"

      - name: Install git-cliff
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: git-cliff

      - name: Compare the release commit with the labels
        id: selection
        uses: $/.github/actions/compare-changelog-selection
        with:
          tag: ${{ steps.tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the release commit matches the labels
        shell: bash
        env:
          ENTRIES: ${{ steps.selection.outputs.entries }}
          EXPECTED: ${{ steps.selection.outputs.expected }}
          MATCHES: ${{ steps.selection.outputs.matches }}
        run: |
          # A promotion release re-tags the previous content and has no entries
          if [ "${ENTRIES}" -eq 0 ]; then
            echo "::notice::No entries in range, nothing to check"
            exit 0
          fi

          if [ "${EXPECTED}" -eq 0 ]; then
            echo "::error::No entry is labeled, so the release would have an empty changelog section. Label at least one merged PR with 'changelog: show'."
            exit 1
          fi

          if [ "${MATCHES}" != "true" ]; then
            echo "::error::The release commit does not match the labels yet. The label workflow rebuilds it and this check runs again."
            exit 1
          fi

          echo "::notice::${EXPECTED} changelog entries"
