# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Dispatch release rebuilds
description: Dispatch the Release workflow when a release PR is open

inputs:
  token:
    description: Token to list pull requests and dispatch workflows with, needs pull-requests:read and actions:write
    required: true

runs:
  using: composite
  steps:
    - name: Dispatch Release
      shell: bash
      env:
        GH_REPO: ${{ github.repository }} # the caller has no checkout, so gh cannot infer the repository from a git remote
        GH_TOKEN: ${{ inputs.token }}
      run: |
        # Release runs in one concurrency group, a second dispatch queues behind the running one
        if [ "$(gh pr list --state open --limit 100 --json headRefName --jq 'any(.[]; .headRefName | startswith("release/v"))')" = "true" ]; then
          echo "::notice::Dispatching Release"

          gh workflow run release.yml --ref main
        fi
